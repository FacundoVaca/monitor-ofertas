name: Actualizar precios de supermercados (SEPA)

on:
  schedule:
    - cron: "30 23 * * *"   # 20:30 hora Argentina (SEPA publica el archivo del día a la tarde)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-super
  cancel-in-progress: false

jobs:
  sepa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar base SEPA (Precios Claros)
        run: |
          URL=$(node scripts/sepa-url.mjs)
          echo "Descargando $URL"
          curl -fL --retry 3 -A "BolsilloOfertas/1.0 (+https://ofertas.bolsillo.online)" -o /tmp/sepa.zip "$URL"
          ls -lh /tmp/sepa.zip
      - name: Descomprimir (zip de zips)
        run: |
          mkdir -p /tmp/sepa && unzip -q -o /tmp/sepa.zip -d /tmp/sepa && rm /tmp/sepa.zip
          for i in 1 2 3; do
            find /tmp/sepa -name '*.zip' | while read -r z; do unzip -q -o "$z" -d "${z%.zip}" || true; rm -f "$z"; done
          done
          find /tmp/sepa -maxdepth 3 | head -20
          du -sh /tmp/sepa
      - name: Procesar por zona
        run: node --max-old-space-size=12000 scripts/sepa.mjs /tmp/sepa /tmp/salida
      - name: Publicar en la rama "datos"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/salida
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Precios SEPA $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
